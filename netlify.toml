[build]
  base = "web"
  # O `force=true` em web/.npmrc libera o binding WASM do compilador do Astro
  # (declarado para cpu wasm32) em máquinas x64. Vale também para o install
  # automático que o Netlify roda antes deste comando.
  command = "npm ci && npm run build"
  publish = "dist"
  # Não gasta um deploy de produção quando o push não mexeu no site.
  # (No plano Free cada deploy de produção custa 15 dos 300 créditos/mês.)
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "24"

# www.flowizehub.com → flowizehub.com
[[redirects]]
  from = "https://www.flowizehub.com/*"
  to = "https://flowizehub.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/qr/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/exemplos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
