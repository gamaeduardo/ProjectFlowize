[build]
  base = "web"
  # --force é necessário para instalar o binding WASM do compilador do Astro
  # (declarado para cpu wasm32) em máquinas x64.
  command = "npm ci --force && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# www.flowizehub.com → flowizehub.com
[[redirects]]
  from = "https://www.flowizehub.com/*"
  to = "https://flowizehub.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/qr/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/exemplos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
